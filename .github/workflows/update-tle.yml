
name: Update IOD2 TLE

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iod2-tle-update
  cancel-in-progress: false

jobs:
  update-tle:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate TLE
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = (
              "https://celestrak.org/NORAD/elements/gp.php"
              "?CATNR=64538&FORMAT=TLE"
          )

          target = Path("Iod2-tracking/tle.json")

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "IOD2-Startical-Tracking/1.0",
                  "Accept": "text/plain"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=20
          ) as response:
              text = response.read().decode("utf-8")

          lines = [
              line.strip()
              for line in text.splitlines()
              if line.strip()
          ]

          line1 = next(
              (line for line in lines if line.startswith("1 ")),
              None
          )

          line2 = next(
              (line for line in lines if line.startswith("2 ")),
              None
          )

          if not line1 or not line2:
              raise ValueError("No valid TLE lines returned")

          if (
              len(line1) != 69
              or len(line2) != 69
              or line1[2:7] != "64538"
              or line2[2:7] != "64538"
          ):
              raise ValueError("Unexpected TLE format or NORAD ID")

          def checksum_ok(line):
              total = sum(
                  int(c) if c.isdigit() else 1 if c == "-" else 0
                  for c in line[:68]
              )
              return (
                  line[68].isdigit()
                  and total % 10 == int(line[68])
              )

          if not checksum_ok(line1) or not checksum_ok(line2):
              raise ValueError("Invalid TLE checksum")

          data = {
              "satellite": "IOD2",
              "tle_line1": line1,
              "tle_line2": line2,
              "source": "CelesTrak",
              "last_update": datetime.now(
                  timezone.utc
              ).isoformat().replace("+00:00", "Z")
          }

          target.parent.mkdir(parents=True, exist_ok=True)

          target.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )

          print("IOD2 TLE validated and saved")
          PY

      - name: Commit updated TLE
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Iod2-tracking/tle.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update IOD2 TLE"
          git push
